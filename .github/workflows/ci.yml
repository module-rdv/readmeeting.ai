name: ReadMeeting.ai CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-frontend:
    name: Build & Test Frontend (React / Vite / TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies
        run: npm ci || npm install
      - name: Lint and Typecheck
        run: npm run lint
      - name: Test transcript service
        run: npm run test:transcript
      - name: Build frontend
        run: npm run build

  build-backend:
    name: Build Backend (.NET 10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore dependencies
        run: dotnet restore backend/ReadMeeting.sln
      - name: Build Solution
        run: dotnet build backend/ReadMeeting.sln --no-restore --configuration Release
      - name: Test API security
        run: dotnet test backend/ReadMeeting.sln --no-build --configuration Release
